<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championnat de France de Pizza Finale 2026 - Jury</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-touch-callout: none; /* iOS Safari */
            -webkit-user-select: none; /* Safari */
            -khtml-user-select: none; /* Konqueror HTML */
            -moz-user-select: none; /* Old versions of Firefox */
            -ms-user-select: none; /* Internet Explorer/Edge */
            user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox*/
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-header {
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .card-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 8px;
        }

        .card-date {
            color: #666;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-date::before {
            content: "📅";
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .jury-button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            color: white;
            display: block;
        }

        .jury-button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-preparation {
            background: linear-gradient(135deg, #e2fd36 0%, #dec33d 100%);
        }
        .btn-fabrication {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-pizzaiolo {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-chef {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .btn-res {
            display: none;
            background: linear-gradient(135deg, #07f60f 0%, #57c33c 100%);
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍕 Championnat de France de Pizza Finale 2026 - Jury 🍕</h1>
        <p>Espace Jury</p>
    </div>

    <div class="container">
        <div class="cards-grid">

            <div class="card" id="classique">
                <div class="card-header">
                    <h2 class="card-title">Classique</h2>
                </div>
                <div class="buttons-container">
                    <a href="https://forms.gle/DthBbUWPrv4wVm4D9" target="_blank" rel="noopener noreferrer" class="jury-button btn-preparation">Juge de Préparation</a>
                    <a href="https://forms.gle/cHJh1XDz67h2JLs9A" target="_blank" rel="noopener noreferrer" class="jury-button btn-fabrication">Juge de Fabrication</a>
                    <a href="https://forms.gle/VSt4skB6WDMT2qKW6" target="_blank" rel="noopener noreferrer" class="jury-button btn-pizzaiolo">Juge Pizzaïolo</a>
                    <a href="https://forms.gle/oJFehkVpJ8DANth1A" target="_blank" rel="noopener noreferrer" class="jury-button btn-chef">Juge Chef de Cuisine</a>
                    <a href="https://docs.google.com/spreadsheets/d/17yWEOa8nz223Uon8rM5BZWGXHiCANTZhAxX5LATLAJc/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="jury-button btn-res">Résultats</a>
                </div>
            </div>
        </div> 
    </div>
    <script>
        let clickCount = 0;
        const card = document.querySelector('#classique');
        const resultsButton = document.querySelector('.btn-res');

        resultsButton.style.display = 'none';

        card.addEventListener('click', function() {
            clickCount++;
            if (clickCount === 10) {
                resultsButton.style.display = 'block';
            }
        });
    </script>
</body>
</html>
